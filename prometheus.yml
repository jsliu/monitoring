# Scraped every 15 s; history kept 2 years (docker-compose.yml). Every target is a port a project serves on the
# host's 127.0.0.1; the intraday node is only up while its launcher runs, thetagang-nt only while its bot runs.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: exporter
    static_configs:
      - targets: ["host.docker.internal:9102"]  # ../intraday monitoring/docker-compose.yml
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9101"]
  - job_name: thetagang  # thetagang's portfolio monitor (../thetagang deploy/), host's 127.0.0.1:9464
    static_configs:
      - targets: ["host.docker.internal:9464"]
  - job_name: thetagang-strategy  # thetagang's trading strategy, only while it runs: 127.0.0.1:9465
    static_configs:
      - targets: ["host.docker.internal:9465"]
